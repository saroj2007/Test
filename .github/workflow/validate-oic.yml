name: OIC Code Validation Pipeline

# Trigger thE workflow whenever a Pull Request is opened or updated against the 'TESt-OIC' branch
on:
  pull_request:
    branches: [ TEST-OIC ]

permissions:
  contents: read
  pull-requests: write # Gives the runner permission to post review comments on the PR

jobs:
  ai-code-audit: # <--- THIS IS THE EXACT JOB NAME FOR BRANCH PROTECTION
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to calculate file differences

      - name: Isolate Project Changes
        id: pr_diff
        run: |
          # Compare the PR branch against the target 'TEST-OIC' branch for OIC JSON files
          git diff origin/${{ github.base_ref }}...HEAD -- '*.json' > pr_diff.txt
          echo "DIFF_FILE=pr_diff.txt" >> $GITHUB_ENV

      - name: Run AI Audit Review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const diffContent = fs.readFileSync(process.env.DIFF_FILE, 'utf8');
            
            if (!diffContent.trim()) {
              console.log("No OIC configuration changes found in this PR.");
              return;
            }

            const systemPrompt = `You are an expert Enterprise Integration Architect auditing OIC Gen 3 metadata. 
            Review the diff for: 
            1. Hardcoded hostnames. 
            2. Missing Global Fault Handlers.
            If the code looks compliant, reply with exactly 'PASS'. Otherwise, detail the 'Violations Found'.`;

            const response = await fetch('https://api.openai.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: 'gpt-4o',
                messages: [
                  { role: 'system', content: systemPrompt },
                  { role: 'user', content: `Review this diff:\n\n${diffContent}` }
                ],
                temperature: 0.2
              })
            });

            const data = await response.json();
            const auditResult = data.choices[0].message.content.trim();

            // Post comments back to the PR screen
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 👮 AI Automated OIC Audit Report\n\n${auditResult}`
            });

            // Fail the job explicitly if violations exist
            if (auditResult !== 'PASS' && auditResult.includes('Violations Found')) {
              core.setFailed("OIC Code Audit failed compliance checks.");
            }
