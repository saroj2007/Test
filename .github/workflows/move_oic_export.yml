name: Move OIC Export to Custom Folder

on:
  push:
    paths:
      - 'projects/**'  # Triggers only when OIC exports a project

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move project files
        run: |
          # Replace 'YOUR_EXISTING_FOLDER' with your actual folder name
          DEST_FOLDER="OIC-DEV"
          
          # Create destination if it doesn't exist
          # mkdir -p $DEST_FOLDER
          
          # Move everything from 'projects' to your folder
          # Use 'cp -r' then 'rm' to ensure clean movement
          cp -r projects/* $DEST_FOLDER/
          rm -rf projects/
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "OIC Automation"
          git config --global user.email "oic-bot@github.com"
          git add .
          git commit -m "Automated move: Relocating OIC export to custom folder"
          git push
